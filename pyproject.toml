[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "track-eye"
version = "0.1.0"
description = "Software-only per-eye pupil tracking appliance"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mediapipe==0.10.14",
  "opencv-python==4.13.0.92",
  "opencv-contrib-python==4.13.0.92",
  "numpy==2.4.6",
  "protobuf==4.25.9",
]

[tool.setuptools.packages.find]
include = ["track_eye*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
